version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yieldsense-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DEBUG=false
      - API_V1_PREFIX=/api/v1
    env_file:
      - ./backend/.env
    restart: unless-stopped
    networks:
      - yieldsense-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yieldsense-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    env_file:
      - ./frontend/.env.local
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - yieldsense-network

networks:
  yieldsense-network:
    driver: bridge
