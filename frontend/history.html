<!DOCTYPE html>
<html>
<head>
    <title>Prediction History</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f7fa;
            padding:30px;
        }

        h1{
            color:#2e7d32;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid #ddd;
            padding:12px;
            text-align:center;
        }

        th{
            background:#2e7d32;
            color:white;
        }

        tr:nth-child(even){
            background:#f8f8f8;
        }
    </style>

</head>
<body>

<h1>Prediction History</h1>

<table id="historyTable">

<thead>
<tr>
<th>ID</th>
<th>Crop</th>
<th>Yield</th>
<th>Risk</th>
<th>Date</th>
</tr>
</thead>

<tbody>

</tbody>

</table>

<script src="history.js"></script>

</body>
</html>
