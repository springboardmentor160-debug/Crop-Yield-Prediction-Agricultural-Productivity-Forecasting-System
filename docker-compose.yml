version: "3.9"

services:
  backend:
    build: ./backend
    container_name: yieldsense-backend
    ports:
      - "8000:8000"
    volumes:
      - yieldsense-data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/yieldsense.db
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production-yieldsense-ai-2026}
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: yieldsense-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  yieldsense-data:
