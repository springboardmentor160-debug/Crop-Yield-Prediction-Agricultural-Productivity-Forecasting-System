<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Register - YieldSense AI</title>

    <link rel="stylesheet" href="auth.css">

</head>

<body>

<div class="auth-container">

    <div class="brand">

        <h1>🌾 YieldSense AI</h1>


        <p>
            AI-Powered Crop Yield Prediction,
                Soil Analysis & Smart Farming Insights
            <div class="features">

    <div>🌱 Soil Analysis</div>

    <div>🌦 Weather Intelligence</div>

    <div>📈 Yield Prediction</div>

    <div>🤖 AI Advisory</div>

</div>

        </p>

    </div>

    <div class="auth-box">

        <h2>Create Account 🚀</h2>

        <input
            type="text"
            id="name"
            placeholder="Full Name"
        >

        <input
            type="email"
            id="email"
            placeholder="Email Address"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <select id="role">

            <option value="Farmer">
                Farmer
            </option>

            <option value="Researcher">
                Researcher
            </option>

        </select>

        <button onclick="registerUser()">
            Register
        </button>

        <div class="bottom-link">

            Already Registered?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</div>

<script src="auth.js"></script>


</body>
</html>
