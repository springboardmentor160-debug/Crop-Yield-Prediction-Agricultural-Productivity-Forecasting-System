services:

  postgres:
    image: postgres:16
    container_name: yieldsense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yieldsense
      POSTGRES_USER: yieldsense_user
      POSTGRES_PASSWORD: yieldsense_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    container_name: yieldsense-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:123456@localhost:5432/yieldsense
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data: